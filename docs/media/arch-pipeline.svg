<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="End-to-end architecture: browser and CLI enter the same pipeline; audio locates candidate windows, OCR and active-speaker detection verify each one, the classifier picks a winner and the refiner pins the exact frame.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5058"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C7B"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker>
  </defs>
  <rect width="1180" height="560" fill="#FBFAF7"/>
  <style>
    .t{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:600;fill:#1B1E23}
    .s{font-family:"Segoe UI",Arial,sans-serif;font-size:11.5px;fill:#5D636D}
    .m{font-family:Consolas,monospace;font-size:11px;fill:#1B1E23}
    .lbl{font-family:Consolas,monospace;font-size:10.5px;fill:#5D636D}
    .lane{font-family:Consolas,monospace;font-size:11px;letter-spacing:.08em;fill:#8A9099}
    .box{fill:#FFFFFF;stroke:#C9C5BC;stroke-width:1.2}
    .teal{fill:#E9F6F5;stroke:#0E7C7B;stroke-width:1.6}
    .amber{fill:#FDF3E0;stroke:#B7791F;stroke-width:1.6}
    .flow{stroke:#4A5058;stroke-width:1.5;fill:none}
    .tflow{stroke:#0E7C7B;stroke-width:2;fill:none}
    .aflow{stroke:#B7791F;stroke-width:2;fill:none}
  </style>

  <rect x="16" y="16" width="1148" height="86" rx="6" fill="#F1EFE9"/>
  <text class="lane" x="30" y="38">INTERFACES — same pipeline behind both</text>
  <rect class="box" x="40" y="48" width="220" height="42" rx="4"/>
  <text class="t" x="150" y="66" text-anchor="middle">Web page</text>
  <text class="s" x="150" y="82" text-anchor="middle">live stages · timeline · player sync</text>
  <rect class="box" x="290" y="48" width="200" height="42" rx="4"/>
  <text class="t" x="390" y="66" text-anchor="middle">CLI</text>
  <text class="s" x="390" y="82" text-anchor="middle">python -m dialogue_finder</text>
  <rect class="box" x="520" y="48" width="250" height="42" rx="4"/>
  <text class="t" x="645" y="66" text-anchor="middle">FastAPI + SSE</text>
  <text class="s" x="645" y="82" text-anchor="middle">POST /jobs · GET /events · /frames</text>
  <line class="flow" x1="260" y1="69" x2="288" y2="69" marker-end="url(#ah)"/>
  <line class="flow" x1="490" y1="69" x2="518" y2="69" marker-end="url(#ah)"/>

  <rect x="16" y="118" width="1148" height="140" rx="6" fill="#F1EFE9"/>
  <text class="lane" x="30" y="140">STEP 1 — WHERE TO LOOK (once per video, cached)</text>
  <rect class="box" x="40" y="156" width="180" height="72" rx="4"/>
  <text class="t" x="130" y="182" text-anchor="middle">Fetch</text>
  <text class="s" x="130" y="200" text-anchor="middle">yt-dlp → cache/</text>
  <text class="s" x="130" y="216" text-anchor="middle">URL or local file</text>
  <rect class="box" x="252" y="156" width="200" height="72" rx="4"/>
  <text class="t" x="352" y="182" text-anchor="middle">Transcribe</text>
  <text class="s" x="352" y="200" text-anchor="middle">faster-whisper, word times</text>
  <text class="m" x="352" y="217" text-anchor="middle">GPU 48.9s · CPU 141s</text>
  <rect class="amber" x="484" y="156" width="220" height="72" rx="4"/>
  <text class="t" x="594" y="182" text-anchor="middle">Match the line</text>
  <text class="s" x="594" y="200" text-anchor="middle">rapidfuzz over the transcript</text>
  <text class="m" x="594" y="217" text-anchor="middle">every window ≥ 0.60</text>
  <rect class="amber" x="736" y="156" width="200" height="72" rx="4"/>
  <text class="t" x="836" y="182" text-anchor="middle">Candidate windows</text>
  <text class="s" x="836" y="200" text-anchor="middle">up to 5, non-overlapping</text>
  <text class="m" x="836" y="217" text-anchor="middle">± 3 s padding</text>
  <line class="flow" x1="220" y1="192" x2="250" y2="192" marker-end="url(#ah)"/>
  <line class="flow" x1="452" y1="192" x2="482" y2="192" marker-end="url(#ah)"/>
  <line class="aflow" x1="704" y1="192" x2="734" y2="192" marker-end="url(#aa)"/>
  <text class="lbl" x="968" y="186">54-minute video</text>
  <text class="lbl" x="968" y="202">→ a few seconds</text>
  <text class="lbl" x="968" y="218">of frames to read</text>

  <rect x="16" y="274" width="1148" height="150" rx="6" fill="#F1EFE9"/>
  <text class="lane" x="30" y="296">STEP 2 — VERIFY EACH WINDOW (three kinds of evidence)</text>
  <rect class="teal" x="40" y="312" width="230" height="94" rx="4"/>
  <text class="t" x="155" y="336" text-anchor="middle">On-screen text</text>
  <text class="s" x="155" y="354" text-anchor="middle">RapidOCR, subtitle band first</text>
  <text class="s" x="155" y="371" text-anchor="middle">full frame if that misses</text>
  <text class="m" x="155" y="391" text-anchor="middle">GPU ~20 ms · CPU ~600 ms</text>
  <rect class="box" x="300" y="312" width="200" height="94" rx="4"/>
  <text class="t" x="400" y="336" text-anchor="middle">Faces</text>
  <text class="s" x="400" y="354" text-anchor="middle">YuNet detect + IoU tracks</text>
  <text class="s" x="400" y="371" text-anchor="middle">median-smoothed boxes</text>
  <text class="m" x="400" y="391" text-anchor="middle">usable ≥ 0.5 s, ≥ 40 px</text>
  <rect class="amber" x="530" y="312" width="230" height="94" rx="4"/>
  <text class="t" x="645" y="336" text-anchor="middle">Who is speaking</text>
  <text class="s" x="645" y="354" text-anchor="middle">LR-ASD on each face track</text>
  <text class="s" x="645" y="371" text-anchor="middle">+ speech mask (Silero VAD)</text>
  <text class="m" x="645" y="391" text-anchor="middle">score per frame, 0–1</text>
  <rect class="box" x="790" y="312" width="146" height="94" rx="4"/>
  <text class="t" x="863" y="342" text-anchor="middle">Classify</text>
  <text class="s" x="863" y="362" text-anchor="middle">valid-text</text>
  <text class="s" x="863" y="378" text-anchor="middle">valid-speaker</text>
  <text class="s" x="863" y="394" text-anchor="middle">uncertain · invalid</text>
  <rect class="box" x="966" y="312" width="176" height="94" rx="4"/>
  <text class="t" x="1054" y="342" text-anchor="middle">Pick the winner</text>
  <text class="s" x="1054" y="362" text-anchor="middle">strongest evidence,</text>
  <text class="s" x="1054" y="378" text-anchor="middle">then best ASR score,</text>
  <text class="s" x="1054" y="394" text-anchor="middle">then earliest</text>
  <line class="flow" x1="270" y1="359" x2="298" y2="359" marker-end="url(#ah)"/>
  <line class="flow" x1="500" y1="359" x2="528" y2="359" marker-end="url(#ah)"/>
  <line class="flow" x1="760" y1="359" x2="788" y2="359" marker-end="url(#ah)"/>
  <line class="flow" x1="936" y1="359" x2="964" y2="359" marker-end="url(#ah)"/>
  <path class="aflow" d="M836,228 L836,262 L155,262 L155,310" marker-end="url(#aa)"/>
  <text class="lbl" x="420" y="256">each candidate window is verified independently</text>

  <rect x="16" y="440" width="1148" height="104" rx="6" fill="#F1EFE9"/>
  <text class="lane" x="30" y="462">STEP 3 — WHICH FRAME, EXACTLY</text>
  <rect class="teal" x="40" y="478" width="260" height="52" rx="4"/>
  <text class="t" x="170" y="500" text-anchor="middle">Text found → binary search</text>
  <text class="s" x="170" y="518" text-anchor="middle">3–4 OCR reads pin the first frame</text>
  <rect class="amber" x="330" y="478" width="260" height="52" rx="4"/>
  <text class="t" x="460" y="500" text-anchor="middle">Speaker found → visual onset</text>
  <text class="s" x="460" y="518" text-anchor="middle">first frame the lips start moving</text>
  <rect class="box" x="620" y="478" width="230" height="52" rx="4"/>
  <text class="t" x="735" y="500" text-anchor="middle">Neither → audio frame</text>
  <text class="s" x="735" y="518" text-anchor="middle">labelled uncertain or invalid</text>
  <rect class="box" x="880" y="470" width="262" height="68" rx="4"/>
  <text class="t" x="1011" y="494" text-anchor="middle">Result</text>
  <text class="s" x="1011" y="512" text-anchor="middle">timecode · frame no. · text · confidence</text>
  <text class="s" x="1011" y="528" text-anchor="middle">frame n−1 and n as evidence</text>
  <line class="tflow" x1="300" y1="504" x2="328" y2="504" marker-end="url(#at)"/>
  <line class="flow" x1="590" y1="504" x2="618" y2="504" marker-end="url(#ah)"/>
  <line class="flow" x1="850" y1="504" x2="878" y2="504" marker-end="url(#ah)"/>
</svg>
